<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes cours</title>
  <style>
    :root{color-scheme:dark}body{font-family:system-ui,Arial,sans-serif;background:#101827;color:#f8fafc;max-width:780px;margin:55px auto;padding:0 20px}h1{font-size:2rem}p{color:#cbd5e1}#cours{display:grid;gap:12px;margin-top:25px}a.cours{display:block;padding:17px 20px;background:#1e293b;color:#93c5fd;border-radius:12px;text-decoration:none;border:1px solid #334155}a.cours:hover{background:#334155}#etat{color:#cbd5e1}
  </style>
</head>
<body>
  <h1>📚 Mes cours</h1>
  <p>Sélectionne un cours pour l'ouvrir.</p>
  <div id="etat">Chargement des cours…</div>
  <main id="cours"></main>
  <script>
    async function afficherCours() {
      const etat = document.getElementById('etat');
      const liste = document.getElementById('cours');
      try {
        const reponse = await fetch('./cours.json', {cache:'no-store'});
        if (!reponse.ok) throw new Error('Liste indisponible');
        const fichiers = await reponse.json();
        if (!Array.isArray(fichiers)) throw new Error('Format invalide');
        etat.textContent = fichiers.length ? '' : 'Aucun cours disponible pour le moment.';
        for (const fichier of fichiers) {
          const lien = document.createElement('a');
          lien.className = 'cours';
          lien.href = fichier;
          lien.textContent = decodeURIComponent(fichier.split('/').pop()).replace(/\.html?$/i,'').replace(/[-_]/g,' ');
          liste.appendChild(lien);
        }
      } catch (erreur) {
        etat.textContent = 'Impossible de charger les cours. Vérifie que GitHub Pages est activé et que cours.json existe.';
      }
    }
    afficherCours();
  </script>
</body>
</html>
